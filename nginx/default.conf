# Vkladá sa do http{} z nginx-unprivileged (conf.d/*.conf).
# skutočná IP klienta od Traefiku (inak by sa rate limit delil medzi všetkých cez IP proxy);
# dôveruj X-Forwarded-For len z Docker sietí, Traefik nedôveruje hlavičkám zvonka
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=didaktik_perip:2m rate=30r/s;

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # iba statika
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    limit_req zone=didaktik_perip burst=150 nodelay;

    # MIME typy ide zo štandardného mime.types (obsahuje application/wasm; Dockerfile to pri builde overí).
    # POZOR: vlastný blok types{} v server{} by prepísal VŠETKY typy -> JS/CSS by išli ako octet-stream.

    gzip on;
    gzip_types text/css application/javascript application/wasm text/plain image/svg+xml;
    gzip_min_length 1024;

    # --- bezpečnostné hlavičky (v tomto bloku, nie v location, aby sa nestratili) ---
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; manifest-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self), autoplay=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # súbory nemajú hash v názve -> vždy revalidovať (ETag/Last-Modified, 304), aby sa po
    # aktualizácii nemiešal starý a nový JS/WASM. (expires, nie add_header: add_header
    # v location by zrušil bezpečnostné hlavičky zo server{}.)
    location /jsspeccy/ {
        expires epoch;
        try_files $uri =404;
    }

    location / {
        expires epoch;
        try_files $uri $uri/ =404;
    }

    # skryté súbory nikdy
    location ~ /\. { return 404; }
}
